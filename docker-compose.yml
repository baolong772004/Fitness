services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FitnessPass2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - fitness_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FitnessPass2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - fitness_mongo_data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      DATABASE_URL: "sqlserver://sqlserver:1433;database=fitness_db;user=sa;password=FitnessPass2026;encrypt=false;trustServerCertificate=true"
      MONGODB_URI: "mongodb://mongodb:27017/fitness_db"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - fitness_qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  fitness_sql_data:
  fitness_mongo_data:
  fitness_qdrant_data:
