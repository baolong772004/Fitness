name: cafe_fit_mobile
description: Café Fit member app for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
